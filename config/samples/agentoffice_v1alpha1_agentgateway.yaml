apiVersion: agentoffice.ai/v1alpha1
kind: AgentGateway
metadata:
  name: research-gateway
  namespace: agent-office
spec:
  displayName: "Research Gateway"
  description: |
    Shared OpenClaw gateway runtime for the Karpathy auto-research crew.
    Multiple AgentWorkstations with `runtime.shared.gatewayRef:
    research-gateway` slot in as logical openclaw agents inside this
    pod, sharing the paired browser node-host VM via a per-agent
    Chromium profile.
  image: quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/openclaw:latest
  nodeHostRef:
    name: fedora-black-zebra-36
    namespace: default
  # Optional: OpenClaw webhook ingress (POST /hooks/wake, POST /hooks/agent)
  # for external systems that need to trigger a targeted agent turn. The
  # token is read from a Secret in this namespace and reaches the pod as
  # the env var OPENCLAW_HOOKS_TOKEN; openclaw.json only ever carries
  # "${OPENCLAW_HOOKS_TOKEN}". Keep it distinct from the gateway token.
  #
  # hooks:
  #   enabled: true
  #   tokenSecretRef:
  #     name: research-gateway-hooks
  #     key: token
  #   path: /hooks
  #   allowedAgentIds: ["web-browser-researcher"]
  #   allowRequestSessionKey: false
